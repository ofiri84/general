AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup. Lets GitHub Actions in the given repo deploy the Yachad CDK stack
  without long-lived AWS keys. Deploy with:
    aws cloudformation deploy --stack-name yachad-github-oidc \
      --template-file infra/github-oidc.yml --capabilities CAPABILITY_NAMED_IAM \
      --region us-east-1 --parameter-overrides GitHubRepo=ofiri84/general

Parameters:
  GitHubRepo:
    Type: String
    Default: ofiri84/general
    Description: owner/name of the GitHub repository allowed to deploy
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: yachad-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:*
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-*
              - Effect: Allow
                Action: [sts:GetCallerIdentity]
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Save as the GitHub secret AWS_ROLE_ARN
